name: CI

on:
  push:
    branches: [main, master, mves]
  pull_request:
    branches: [main, master, mves]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      
      - name: Uninstall conflicting packages
        run: pip uninstall -y pylama pylama-core 2>/dev/null || true
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy pyyaml pytest flake8
      
      - name: Verify imports
        run: python -c "import numpy, yaml, pytest, flake8; print('All imports OK')"
      
      - name: Run flake8
        run: flake8 agi/ --max-line-length=100 --ignore=E501,W503 --show-source
      
      - name: Debug test discovery
        run: |
          echo "Current directory: $(pwd)"
          echo "Directory structure:"
          ls -la
          echo "Tests directory:"
          ls -la tests/
          echo "Python path:"
          python -c "import sys; print(chr(10).join(sys.path))"
          echo "Test discovery:"
          python -m pytest tests/ --collect-only 2>&1 || true
      
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/ -v --tb=short -W ignore::DeprecationWarning --color=yes 2>&1
      
      - name: Test import
        run: python -c "from agi.agent import AGIAgent; print('Agent import OK')"
