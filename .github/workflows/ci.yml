name: CI

on:
  push:
    branches: [main, master, mves]
  pull_request:
    branches: [main, master, mves]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install numpy pyyaml pytest flake8

      - name: Run lint
        run: |
          python -m flake8 agi/ --max-line-length=100 --ignore=E501,W503

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short -p no:warnings

      - name: Verify JSON serialization
        run: |
          python -c "
          import sys, json
          sys.path.insert(0, '.')
          from agi.agent import AGIAgent
          agent = AGIAgent('config/agent_config.yaml')
          for c in range(1, 11):
              agent.cycle = c
              agent._one_cycle()
          state = {
              'drives': agent.drive_manager.get_drive_summary(),
              'behavior': agent.behavior_tracker.get_behavior_summary(),
              'memory': agent.memory.get_stats(),
              'env': agent.env.get_stats(),
          }
          json.dumps(state, indent=2)
          print('JSON serialization: OK')
          "
