name: CI

on:
  push:
    branches: [main, master, mves]
  pull_request:
    branches: [main, master, mves]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pyyaml pytest flake8
      - run: flake8 agi/ --max-line-length=100 --ignore=E501,W503
      - run: python -m pytest tests/ -v
      - run: python -c "from agi.agent import AGIAgent; print('import OK')"
