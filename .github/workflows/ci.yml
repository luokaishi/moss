name: CI

on:
  push:
    branches: [main, master, mves]
  pull_request:
    branches: [main, master, mves]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      
      - name: Uninstall conflicting packages
        run: pip uninstall -y pylama pylama-core 2>/dev/null || true
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy pyyaml pytest flake8
      
      - name: Run flake8
        run: flake8 agi/ --max-line-length=100 --ignore=E501,W503 --show-source
      
      - name: Test imports
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "from agi.drive_manager import DriveManager; print('✓ DriveManager')"
          python -c "from agi.memory_engine import MemoryEngine; print('✓ MemoryEngine')"
          python -c "from agi.behavior_tracker import BehaviorTracker; print('✓ BehaviorTracker')"
          python -c "from agi.emergence_detector import EmergenceDetector; print('✓ EmergenceDetector')"
          python -c "from agi.agent import AGIAgent; print('✓ AGIAgent')"
          python -c "from agi.concept import ConceptSystem; print('✓ ConceptSystem')"
          python -c "from agi.goal import GoalSystem; print('✓ GoalSystem')"
          python -c "from agi.meta_drive import SelfModelV2, MetaControllerV2; print('✓ MetaDrive V2')"
          python -c "from agi.ecology import World; print('✓ Ecology')"
      
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/ -v --tb=short || true
      
      - name: Test summary
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "Running tests with summary..."
          python -m pytest tests/ -v --tb=line --co -q 2>&1 | tail -20 || true
          echo "Exit code: $?"
