name: CI

on:
  push:
    branches: [main, master, mves]
  pull_request:
    branches: [main, master, mves]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      
      - name: Uninstall conflicting packages
        run: pip uninstall -y pylama pylama-core 2>/dev/null || true
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy pyyaml pytest flake8
      
      - name: Verify imports
        run: |
          python -c "import numpy, yaml, pytest, flake8; print('All imports OK')"
          python -c "import sys; sys.path.insert(0, '.'); from agi.agent import AGIAgent; print('AGIAgent import OK')"
      
      - name: Run flake8
        run: flake8 agi/ --max-line-length=100 --ignore=E501,W503 --show-source
      
      - name: Test single import
        run: |
          cd ${{ github.workspace }}
          python -c "from agi.drive_manager import DriveManager; print('DriveManager OK')"
          python -c "from agi.memory_engine import MemoryEngine; print('MemoryEngine OK')"
          python -c "from agi.behavior_tracker import BehaviorTracker; print('BehaviorTracker OK')"
          python -c "from agi.emergence_detector import EmergenceDetector; print('EmergenceDetector OK')"
      
      - name: Run tests with full output
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd ${{ github.workspace }}
          python -m pytest tests/test_agi_core.py -v --tb=long --capture=no -x 2>&1 | head -200
        continue-on-error: true
      
      - name: Run all tests (final)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd ${{ github.workspace }}
          python -m pytest tests/ -v --tb=short 2>&1
