[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moss-refactor"
version = "9.3.0"
description = "MOSS - Smart Code Refactoring Engine"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "MOSS DevTools", email = "support@moss-devtools.com"}
]
keywords = ["refactoring", "code-analysis", "python", "IDE", "LSP", "ML"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.9"
dependencies = [
    "networkx>=2.8",
]

[project.optional-dependencies]
ml = [
    "numpy>=1.21",
]
local-llm = [
    "torch>=2.0",
    "transformers>=4.30",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]
docs = [
    "mkdocs>=1.4",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.20",
]

[project.scripts]
moss = "moss.cli:main"

[project.urls]
Homepage = "https://moss-devtools.github.io/moss"
Documentation = "https://moss-devtools.github.io/moss"
Repository = "https://github.com/moss-devtools/moss"
Issues = "https://github.com/moss-devtools/moss/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["moss*"]
exclude = ["tests*", "experiments*", "docs-site*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
